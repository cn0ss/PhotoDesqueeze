name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  NOTARY_WAIT_TIMEOUT: 45m

jobs:
  developer-id:
    name: Developer ID Release
    environment: release
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve Release Helpers
        timeout-minutes: 1
        run: |
          set -euo pipefail
          RELEASE_TOOLS_DIR="$RUNNER_TEMP/release-tools"
          mkdir -p "$RELEASE_TOOLS_DIR"
          cp Scripts/notarize.sh "$RELEASE_TOOLS_DIR/notarize.sh"
          chmod +x "$RELEASE_TOOLS_DIR/notarize.sh"
          echo "RELEASE_TOOLS_DIR=$RELEASE_TOOLS_DIR" >> "$GITHUB_ENV"

      - name: Determine Version
        id: version
        timeout-minutes: 2
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must match vX.Y.Z" >&2; exit 1; }
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$VERSION_INPUT"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must match X.Y.Z" >&2; exit 1; }
          git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}" >/dev/null || { echo "Tag v$VERSION does not exist" >&2; exit 1; }
          git checkout --detach "refs/tags/v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
          echo "RELEASE_ASSETS_DIR=$RUNNER_TEMP/release-assets" >> "$GITHUB_ENV"

      - name: Show Xcode
        timeout-minutes: 1
        run: xcodebuild -version

      - name: Test
        timeout-minutes: 20
        run: |
          xcodebuild test \
            -project PhotoDesqueeze.xcodeproj \
            -scheme PhotoDesqueeze \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/PhotoDesqueezeDerivedData"

      - name: Import Developer ID Certificate
        timeout-minutes: 5
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" ]] || { echo "Missing certificate secret" >&2; exit 1; }
          [[ -n "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" ]] || { echo "Missing certificate password secret" >&2; exit 1; }
          [[ -n "$APPLE_KEYCHAIN_PASSWORD" ]] || { echo "Missing keychain password secret" >&2; exit 1; }

          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          echo "SIGNING_CERT_PATH=$CERT_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Build Developer ID App
        timeout-minutes: 30
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ env.VERSION }}
          RELEASE_DIR: ${{ env.RELEASE_DIR }}
        run: Scripts/build-release.sh "$VERSION"

      - name: Notarize App
        timeout-minutes: 50
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          APP_PATH="$RELEASE_DIR/export/PhotoDesqueeze.app"
          NOTARY_ZIP="$RUNNER_TEMP/PhotoDesqueeze-notary.zip"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"
          "$RELEASE_TOOLS_DIR/notarize.sh" "$NOTARY_ZIP"
          xcrun stapler staple "$APP_PATH"

      - name: Package Artifacts
        timeout-minutes: 10
        env:
          VERSION: ${{ env.VERSION }}
          RELEASE_DIR: ${{ env.RELEASE_DIR }}
        run: Scripts/package-dmg.sh "$RELEASE_DIR/export/PhotoDesqueeze.app" "$VERSION"

      - name: Notarize DMG
        timeout-minutes: 50
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          DMG_PATH="$RELEASE_DIR/PhotoDesqueeze-$VERSION.dmg"
          "$RELEASE_TOOLS_DIR/notarize.sh" "$DMG_PATH"
          xcrun stapler staple "$DMG_PATH"

      - name: Verify Release
        timeout-minutes: 10
        run: |
          Scripts/verify-release.sh \
            "$RELEASE_DIR/export/PhotoDesqueeze.app" \
            "$RELEASE_DIR/PhotoDesqueeze-$VERSION.dmg"

      - name: Build Release Notes
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_ASSETS_DIR"
          NOTES_PATH="$RELEASE_ASSETS_DIR/release-notes.md"
          awk -v version="$VERSION" '
            $0 == "## [" version "]" { include = 1; next }
            /^## \[/ && include { include = 0 }
            include { print }
          ' CHANGELOG.md > "$NOTES_PATH"
          if [[ ! -s "$NOTES_PATH" ]]; then
            printf 'See CHANGELOG.md for release notes.\n' > "$NOTES_PATH"
          fi

      - name: Stage Release Assets
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cp "$RELEASE_DIR/PhotoDesqueeze-$VERSION.zip" "$RELEASE_ASSETS_DIR/"
          cp "$RELEASE_DIR/PhotoDesqueeze-$VERSION.dmg" "$RELEASE_ASSETS_DIR/"

      - name: Upload Release Assets
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: developer-id-release
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 1

      - name: Clean Up Signing Material
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "$SIGNING_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
          if [[ -n "${SIGNING_CERT_PATH:-}" && -f "$SIGNING_CERT_PATH" ]]; then
            rm -f "$SIGNING_CERT_PATH"
          fi

  publish:
    name: Publish GitHub Release
    needs: developer-id
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Release Assets
        uses: actions/download-artifact@v7
        timeout-minutes: 5
        with:
          name: developer-id-release
          path: release-assets

      - name: Publish GitHub Release
        timeout-minutes: 5
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.developer-id.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 && RELEASE_EXISTS=1 || RELEASE_EXISTS=0
          if [[ "$RELEASE_EXISTS" == "0" ]]; then
            gh release create "$TAG" \
              --verify-tag \
              --title "PhotoDesqueeze $TAG" \
              --notes-file "release-assets/release-notes.md"
          fi
          gh release upload "$TAG" \
            "release-assets/PhotoDesqueeze-$VERSION.zip" \
            "release-assets/PhotoDesqueeze-$VERSION.dmg" \
            --clobber
