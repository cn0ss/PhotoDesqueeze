name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  developer-id:
    name: Developer ID Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          [[ -n "$VERSION" ]] || { echo "VERSION is required" >&2; exit 1; }
          git rev-parse "v$VERSION" >/dev/null
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Test
        run: |
          xcodebuild test \
            -project PhotoDesqueeze.xcodeproj \
            -scheme PhotoDesqueeze \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/PhotoDesqueezeDerivedData"

      - name: Import Developer ID Certificate
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" ]] || { echo "Missing certificate secret" >&2; exit 1; }
          [[ -n "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" ]] || { echo "Missing certificate password secret" >&2; exit 1; }
          [[ -n "$APPLE_KEYCHAIN_PASSWORD" ]] || { echo "Missing keychain password secret" >&2; exit 1; }

          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Build Developer ID App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ env.VERSION }}
          RELEASE_DIR: ${{ env.RELEASE_DIR }}
        run: Scripts/build-release.sh "$VERSION"

      - name: Notarize App
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          APP_PATH="$RELEASE_DIR/export/PhotoDesqueeze.app"
          NOTARY_ZIP="$RUNNER_TEMP/PhotoDesqueeze-notary.zip"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"
          Scripts/notarize.sh "$NOTARY_ZIP"
          xcrun stapler staple "$APP_PATH"

      - name: Package Artifacts
        env:
          VERSION: ${{ env.VERSION }}
          RELEASE_DIR: ${{ env.RELEASE_DIR }}
        run: Scripts/package-dmg.sh "$RELEASE_DIR/export/PhotoDesqueeze.app" "$VERSION"

      - name: Notarize DMG
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          DMG_PATH="$RELEASE_DIR/PhotoDesqueeze-$VERSION.dmg"
          Scripts/notarize.sh "$DMG_PATH"
          xcrun stapler staple "$DMG_PATH"

      - name: Verify Release
        run: |
          Scripts/verify-release.sh \
            "$RELEASE_DIR/export/PhotoDesqueeze.app" \
            "$RELEASE_DIR/PhotoDesqueeze-$VERSION.dmg"

      - name: Build Release Notes
        run: |
          set -euo pipefail
          NOTES_PATH="$RUNNER_TEMP/release-notes.md"
          awk -v version="$VERSION" '
            $0 == "## [" version "]" { include = 1; next }
            /^## \[/ && include { include = 0 }
            include { print }
          ' CHANGELOG.md > "$NOTES_PATH"
          if [[ ! -s "$NOTES_PATH" ]]; then
            printf 'See CHANGELOG.md for release notes.\n' > "$NOTES_PATH"
          fi
          echo "RELEASE_NOTES=$NOTES_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 && RELEASE_EXISTS=1 || RELEASE_EXISTS=0
          if [[ "$RELEASE_EXISTS" == "0" ]]; then
            gh release create "$TAG" \
              --verify-tag \
              --title "PhotoDesqueeze $TAG" \
              --notes-file "$RELEASE_NOTES"
          fi
          gh release upload "$TAG" \
            "$RELEASE_DIR/PhotoDesqueeze-$VERSION.zip" \
            "$RELEASE_DIR/PhotoDesqueeze-$VERSION.dmg" \
            --clobber
