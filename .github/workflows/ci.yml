name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: macOS Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Test
        run: |
          xcodebuild test \
            -project PhotoDesqueeze.xcodeproj \
            -scheme PhotoDesqueeze \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/PhotoDesqueezeDerivedData"
