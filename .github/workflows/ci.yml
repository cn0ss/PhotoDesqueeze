name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: macOS Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Xcode
        run: xcodebuild -version

      - name: Test
        run: |
          xcodebuild test \
            -project PhotoDesqueeze.xcodeproj \
            -scheme PhotoDesqueeze \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/PhotoDesqueezeDerivedData"
